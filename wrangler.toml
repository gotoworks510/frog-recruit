name = "frog-recruit"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# --- Bindings (IDs are filled in after `wrangler d1/kv create`) ---

[[d1_databases]]
binding = "DB"
database_name = "frog-recruit-db"
database_id = "e4eeced9-5269-4cac-a979-21ccacaefc4d"

[[r2_buckets]]
binding = "R2"
bucket_name = "frog-recruit-files"        # `wrangler r2 bucket create frog-recruit-files`

[[kv_namespaces]]
binding = "KV"
id = "f68df58a2fd643c98ed36a0b00ec116e"

# --- Custom domains ---
# Primary: recruit.frogagent.com (frogagent.com is a Cloudflare zone).
# Legacy: recruit.frog-school.com kept so middleware can 308 → primary.
[[routes]]
pattern = "recruit.frogagent.com"
custom_domain = true

[[routes]]
pattern = "recruit.frog-school.com"
custom_domain = true

[vars]
GOOGLE_CLIENT_ID = "1040291765049-ceb45aaaaaisdkt9vkh1hnkvbg9j5unm.apps.googleusercontent.com"
NEXTAUTH_URL = "https://recruit.frogagent.com"
ADMIN_EMAILS = "senna@frogagent.com"
PUBLIC_BASE_URL = "https://recruit.frogagent.com"
# Email sender — frogagent.com verified in Resend (owner confirmed 2026-06-22).
RECRUIT_FROM_EMAIL = "Frog Recruit <agent@frogagent.com>"
# Job Inbox (Chrome extension capture). Token via `wrangler secret put JOB_INBOX_TOKEN`.
JOB_INBOX_ENABLED = "1"
# Slack channel for candidate LinkedIn refresh requests (ID, not name).
# Bot token: `wrangler secret put SLACK_BOT_TOKEN`
# Optional override: `wrangler secret put SLACK_RECRUIT_CHANNEL_ID`
# Falls back to secret/var SLACK_CHANNEL_ID when unset.

# Required secrets (set via `wrangler secret put <NAME>`):
#   NEXTAUTH_SECRET / AUTH_SECRET
#   GOOGLE_CLIENT_SECRET
#   RESEND_API_KEY
#   JOB_INBOX_TOKEN
#   SLACK_BOT_TOKEN
#   SLACK_CHANNEL_ID or SLACK_RECRUIT_CHANNEL_ID
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (local proxy only)
