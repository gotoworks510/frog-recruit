<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frog Job Capture</title>
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 280px;
        color: #14261c;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: #1f7a4c;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #5b6b62;
        white-space: pre-wrap;
      }
      a {
        color: #1f7a4c;
      }
    </style>
  </head>
  <body>
    <button id="save" type="button">Save to Job Inbox</button>
    <div id="status">Ready.</div>
    <p style="margin: 10px 0 0; font-size: 11px; color: #8a9690">
      <a href="options.html" target="_blank">Options</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
