<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frog Job Capture</title>
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 280px;
        color: #14261c;
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #5b6b62;
        margin-bottom: 6px;
      }
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .seg label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 0;
        padding: 8px 10px;
        border: 1px solid #d5ddd8;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #14261c;
        cursor: pointer;
        background: #f7f9f8;
      }
      .seg input {
        accent-color: #1f7a4c;
      }
      .seg label:has(input:checked) {
        border-color: #1f7a4c;
        background: #e8f5ee;
        color: #145c38;
      }
      button#save {
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: #1f7a4c;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button#save:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #5b6b62;
        white-space: pre-wrap;
      }
      a {
        color: #1f7a4c;
      }
      .hint {
        margin: 0 0 10px;
        font-size: 11px;
        color: #8a9690;
      }
    </style>
  </head>
  <body>
    <div class="field">
      <label>Currency / market</label>
      <div class="seg" role="radiogroup" aria-label="Currency">
        <label>
          <input type="radio" name="currency" value="CAD" checked />
          CAD
        </label>
        <label>
          <input type="radio" name="currency" value="USD" />
          USD
        </label>
      </div>
    </div>
    <p class="hint">Canada roles → CAD · US roles → USD. Last choice is remembered.</p>
    <button id="save" type="button">Save to Job Inbox</button>
    <div id="status">Ready.</div>
    <p style="margin: 10px 0 0; font-size: 11px; color: #8a9690">
      <a href="options.html" target="_blank">Options</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
